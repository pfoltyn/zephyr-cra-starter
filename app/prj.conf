# --- Core -------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ASSERT=n
CONFIG_HW_STACK_PROTECTION=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# --- Shell (UART) -------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# --- Drivers ----------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_WATCHDOG=y

# --- Power management defaults ----------------------------------------------
# nRF52 idles in System ON sleep automatically; devices can be suspended.
CONFIG_PM_DEVICE=y
# PM_DEVICE_RUNTIME is off: with it on, the twin shows the TWI interrupt
# disabled before the first sensor transfer (sensors fail to probe).
# Reproduce on an nRF52840 DK before enabling; tracked in docs/twin-findings.md.
# CONFIG_PM_DEVICE_RUNTIME=y

# --- Settings storage (ZMS on the "storage" partition) -------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_RUNTIME=y

# --- Bluetooth LE -----------------------------------------------------------
CONFIG_BT_DEVICE_NAME="Twin Sensor"
CONFIG_BT_DEVICE_APPEARANCE=1344
CONFIG_BT_SETTINGS=y
CONFIG_BT_RX_STACK_SIZE=2048

# --- Security / update hooks (see docs/cra/) ------------------------------------
# Sysbuild adds MCUboot and signs the image; the application confirms itself after a
# successful self-test so a broken update is rolled back.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_SHELL=y
CONFIG_STACK_CANARIES=y

# --- SBOM: needed by `west spdx` (see scripts/sbom.sh) ---
CONFIG_BUILD_OUTPUT_META=y
