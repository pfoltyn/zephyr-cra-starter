# MCUboot as the immutable first-stage bootloader; application images are
# signed with ECDSA P-256. The key file defaults to MCUboot's PUBLIC DEV KEY
# (fine for the twin and development, NEVER for production). Release builds
# pass -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=<path to secret key>, see docs/cra/.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
